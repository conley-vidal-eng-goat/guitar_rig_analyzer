<text class="note" x="226" y="700" text-anchor="start">0.874 V measured. On a 5 V</text>
<text class="note" x="226" y="716" text-anchor="start">supply the OPA1642 input must</text>
<text class="note" x="226" y="732" text-anchor="start">stay below 1.5 V.</text>
<text class="note" x="440" y="692" text-anchor="start">U1 and U4 are OPA1642 on +5 V. Their channel B halves are terminated as</text>
<text class="note" x="440" y="708" text-anchor="start">followers on OPA_BIAS. Relays are drawn de-energised, the boot state:</text>
<text class="note" x="440" y="724" text-anchor="start">buffer → J5 and TS return → U3. U3 is stacked on U2 by soldered headers.</text>
<text class="note" x="440" y="740" text-anchor="start">Not calibrated. The effect of Amp Out on the RETURN reading is unmeasured.</text>
