<rect class="dash" x="160" y="710" width="640" height="142" rx="4"/>
<text class="lbl" x="172" y="730" text-anchor="start">PROVENANCE &amp; CONVENTIONS</text>
<text class="note" x="172" y="751" text-anchor="start">Net names are CODEC-REFERENCED:  I2S_DIN = codec data IN (Teensy 7, SAI1_TX_DATA0);</text>
<text class="note" x="172" y="767" text-anchor="start">I2S_DOUT = codec data OUT (Teensy 8, SAI1_RX_DATA0).   See netlist.md §4.</text>
<text class="note" x="172" y="790" text-anchor="start">Clocks derive from SAMPLE_RATE 44100. Scope-confirmed on the REPLACED boards:</text>
<text class="note" x="172" y="806" text-anchor="start">LRCLK 44.108 kHz · BCLK ~2.82 MHz · MCLK ~11.29 MHz  (journal 2026-09-06 (1))</text>
<text class="note" x="172" y="829" text-anchor="start">SGTL5000 identified functionally over I²C, not from its package marking.</text>
<text class="note" x="172" y="845" text-anchor="start">The shield's use of the 5V pad is UNVERIFIED. Pin 15 stubs to the unpopulated VOL pad.</text>
<text class="lbl" x="160" y="884" text-anchor="start">THE HEADER STACK IS THE INTERCONNECT, SINCE 2026-09-13:</text>
<text class="note" x="160" y="904" text-anchor="start">•  Shield → Teensy → carrier, soldered. New boards. No flying leads.</text>
<text class="note" x="160" y="922" text-anchor="start">•  Result: 324/324 clean windows, 0 outliers, 26.9 min (TODO-41B)</text>
<text class="note" x="160" y="940" text-anchor="start">•  Idle: SOURCE −65.39, RETURN −65.26 dBFS, LINE-IN-L open</text>
<text class="note" x="160" y="958" text-anchor="start">•  U2 is I²S MASTER — it generates MCLK / BCLK / LRCLK</text>
<text class="note" x="690" y="904" text-anchor="start">⚠  BOARDS AND TOPOLOGY CHANGED TOGETHER.</text>
<text class="note" x="690" y="922" text-anchor="start">   "The stack fixed it" is NOT established. What is</text>
<text class="note" x="690" y="940" text-anchor="start">   established: this assembly does not reproduce the fault.</text>
<text class="note" x="690" y="958" text-anchor="start">   The 10-wire capture of 2026-09-07 is netlist.md §4.</text>
<rect class="dash" x="100" y="1020" width="990" height="270" rx="6"/>
<text class="ttl" x="104" y="1011" text-anchor="start">D — RESERVED, AND HARDWARE DELIBERATELY NOT BUILT</text>
<text class="note" x="130" y="1056" text-anchor="start">Everything else is BUILT — see blocks E to H. What is left here is not "pending": the four jack-detect inputs are</text>
<text class="note" x="130" y="1072" text-anchor="start">decided against (ADR-003, ADR-004) and nothing lands on those pins. The firmware still defines them in config.h.</text>
