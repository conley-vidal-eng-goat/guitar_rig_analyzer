<text class="pin" x="826" y="1422" text-anchor="start">8 · GPIO14</text>
<text class="note" x="597" y="1422" text-anchor="middle">deliberately unconnected</text>
<text class="note" x="160" y="1570" text-anchor="start">The Pi physically cannot send to the Teensy. No 3.3 V or 5 V rail is shared; each board keeps its</text>
<text class="note" x="160" y="1588" text-anchor="start">own supply. Reference capture: 36 481 B/s, zero CRC failures (journal 2026-10-13 (9)).</text>
<text class="note" x="130" y="1642" text-anchor="start">SOURCE_NODE originates on sheet 1 (C2 output, breadboard column 48).</text>
<text class="note" x="130" y="1660" text-anchor="start">RETURN_NODE arrives on sheet 1 from RELAY_RETURN COM (16a) — TS or XLR return, operator-selected.</text>
<text class="ttl" x="130" y="1710" text-anchor="start">VERIFICATION</text>
<text class="note" x="130" y="1738" text-anchor="start">TIERS ARE NOT INTERCHANGEABLE. A part's POSITION and its VALUE are separate claims and are tagged separately.</text>
<text class="note" x="130" y="1756" text-anchor="start">Strip/column assignments are PHYS. Hole-level row letters are RPT (builder-reported), including every coordinate in blocks E to H.</text>
<text class="lbl" x="130" y="1780" text-anchor="start">NYV BY DECISION — open on purpose, not by oversight:</text>
<text class="note" x="130" y="1800" text-anchor="start">•  TOP_RED continuity col 5 ↔ col 55 (GAP-5).  A Phase 7 rail check would close it, but top-vs-bottom was never confirmed.</text>
<text class="note" x="130" y="1818" text-anchor="start">•  Carrier 5V terminal provenance (X-5)  ·  C3/C4/C5/C7 values (A1)  ·  whether Rev D uses the 5V pad (D2).</text>
<text class="note" x="130" y="1836" text-anchor="start">•  K2's and J7's package markings — never read back.  Pole 2 of both relays — wired to nothing, never tested.</text>
<text class="lbl" x="130" y="1866" text-anchor="start">BLOCKS E TO H ARE TRANSCRIBED FROM THE BENCH RECORD, NOT FROM A FRESH INSPECTION.</text>
<text class="note" x="130" y="1886" text-anchor="start">Blocks A and B were captured against the board and photographs on 2026-09-07. E and F were assembled on 2026-09-22 and C, G</text>
<text class="note" x="130" y="1904" text-anchor="start">and H on 2026-10-31 from ai/journal.md, ai/todo.md and ai/evidence/. Nothing was promoted; see netlist.md §14 and §21.</text>
<text class="lbl" x="130" y="1934" text-anchor="start">THIS DRAWING REFLECTS THE PHYSICAL BOARD, NOT docs/breadboard_bringup_v3.md.</text>
<text class="note" x="130" y="1954" text-anchor="start">The runbook carries documented defects in Phase 6 coil polarity, the transistor pin order and the Phase 7 column siting,</text>
<text class="note" x="130" y="1972" text-anchor="start">and has no phase for Amp Out. Where they conflict, the board governs. Construction complete ≠ signed off ≠ validated —</text>
<text class="note" x="130" y="1990" text-anchor="start">Phase 9 has not been run, and the instrument is not calibrated.</text>
