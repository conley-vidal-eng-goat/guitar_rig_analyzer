<text class="gh" x="560" y="1244" text-anchor="start">SPI display (debug only)</text>
<text class="gh" x="890" y="1244" text-anchor="start">deferred</text>
<text class="note" x="130" y="1362" text-anchor="start">SOURCE_NODE originates on sheet 1 (C2 output, breadboard column 48).</text>
<text class="note" x="130" y="1380" text-anchor="start">RETURN_NODE arrives on sheet 1 from RELAY_RETURN COM (16a) — TS or XLR return, operator-selected.</text>
<text class="ttl" x="130" y="1430" text-anchor="start">VERIFICATION</text>
<text class="note" x="130" y="1458" text-anchor="start">TIERS ARE NOT INTERCHANGEABLE. A part's POSITION and its VALUE are separate claims and are tagged separately.</text>
<text class="note" x="130" y="1476" text-anchor="start">Strip/column assignments are PHYS. Hole-level row letters are RPT (builder-reported), including every coordinate in blocks E and F.</text>
<text class="lbl" x="130" y="1500" text-anchor="start">NYV BY DECISION — open on purpose, not by oversight:</text>
<text class="note" x="130" y="1520" text-anchor="start">•  TOP_RED continuity col 5 ↔ col 55 (GAP-5).  A Phase 7 rail check would close it, but top-vs-bottom was never confirmed.</text>
<text class="note" x="130" y="1538" text-anchor="start">•  Carrier 5V terminal provenance (X-5)  ·  C3/C4/C5/C7 values (A1)  ·  whether Rev D uses the 5V pad (D2).</text>
<text class="note" x="130" y="1556" text-anchor="start">•  K2's and J7's package markings — never read back.  Pole 2 of both relays — wired to nothing, never tested.</text>
<text class="lbl" x="130" y="1586" text-anchor="start">BLOCKS E AND F ARE TRANSCRIBED FROM THE BENCH RECORD, NOT FROM A FRESH INSPECTION.</text>
<text class="note" x="130" y="1606" text-anchor="start">Blocks A–C were captured against the board and photographs on 2026-09-07. E and F were assembled on 2026-09-22 from</text>
<text class="note" x="130" y="1624" text-anchor="start">ai/journal.md and ai/todo.md. Nothing was promoted in transcription; see netlist.md §14 for what is NOT evidence.</text>
<text class="lbl" x="130" y="1654" text-anchor="start">THIS DRAWING REFLECTS THE PHYSICAL BOARD, NOT docs/breadboard_bringup_v3.md.</text>
<text class="note" x="130" y="1674" text-anchor="start">The runbook carries documented defects in Phase 6 coil polarity, the transistor pin order and the Phase 7 column siting.</text>
<text class="note" x="130" y="1692" text-anchor="start">Where they conflict, the board governs. Construction complete ≠ signed off ≠ validated — Phase 9 has not been run.</text>
