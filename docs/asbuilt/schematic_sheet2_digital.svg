<rect class="dash" x="160" y="710" width="640" height="142" rx="4"/>
<text class="lbl" x="172" y="730" text-anchor="start">PROVENANCE &amp; CONVENTIONS</text>
<text class="note" x="172" y="751" text-anchor="start">Net names are CODEC-REFERENCED:  I2S_DIN = codec data IN (Teensy 7, SAI1_TX_DATA0);</text>
<text class="note" x="172" y="767" text-anchor="start">I2S_DOUT = codec data OUT (Teensy 8, SAI1_RX_DATA0).   Ref: config.h:81-85</text>
<text class="note" x="172" y="790" text-anchor="start">Clocks derived from SAMPLE_RATE 44100 (config.h:208); all three scope-confirmed:</text>
<text class="note" x="172" y="806" text-anchor="start">LRCLK 44.108 kHz · BCLK ~2.82 MHz · MCLK ~11.29 MHz  (journal 2026-09-06 (1))</text>
<text class="note" x="172" y="829" text-anchor="start">U3 "Rev D" read from silkscreen. SGTL5000 identified functionally over I²C, not</text>
<text class="note" x="172" y="845" text-anchor="start">from its package marking. The shield's use of the 5V pad is UNVERIFIED.</text>
<text class="lbl" x="160" y="884" text-anchor="start">GEOMETRY IS LOAD-BEARING — this is the fix, not a detail:</text>
<text class="note" x="160" y="904" text-anchor="start">•  Jumper length ≈ 25–30 mm (was 100–200 mm flying leads)</text>
<text class="note" x="160" y="922" text-anchor="start">•  U3 sits ≈ 25 mm above U2, bundle held tight, 1:1 screw → pad</text>
<text class="note" x="160" y="940" text-anchor="start">•  Result: 360/360 clean windows, 0 corrupted of 11,520 samples/node</text>
<text class="note" x="160" y="958" text-anchor="start">•  U2 is I²S MASTER — it generates MCLK / BCLK / LRCLK</text>
<text class="note" x="690" y="904" text-anchor="start">⚠  TWO ORANGE WIRES: pin 8 (I2S_DOUT) and pin 19 (I2C_SCL).</text>
<text class="note" x="690" y="922" text-anchor="start">   DOUT is the conductor that caused the corruption fault.</text>
<text class="note" x="690" y="940" text-anchor="start">   Do not re-seat this bundle from memory. Risk R3.</text>
<rect class="dash" x="100" y="1020" width="990" height="300" rx="6"/>
<text class="ttl" x="104" y="1011" text-anchor="start">D — RESERVED, AND HARDWARE DELIBERATELY NOT BUILT</text>
<text class="note" x="130" y="1056" text-anchor="start">Phases 6, 7 and 8 have been BUILT — see blocks E and F. What is left here is not "pending": the four jack-detect</text>
<text class="note" x="130" y="1072" text-anchor="start">inputs are decided against (ADR-003, ADR-004) and nothing lands on those pins. Firmware defines them at config.h:77-101.</text>
