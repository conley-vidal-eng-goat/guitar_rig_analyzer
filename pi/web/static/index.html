<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Guitar Rig Analyzer</title>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./shell.css">
</head>
<body>
<div id="shell">

  <!-- Always visible. A disconnected or stale link must never be discoverable
       only by noticing that a chart stopped moving. -->
  <header id="status">
    <div id="status-line">
      <span class="dot" id="link-dot"></span>
      <span class="pill none" id="kind-pill">no frame</span>
      <span id="status-text">connecting…</span>
    </div>
    <div id="status-detail"></div>
  </header>

  <main id="views">
    <section class="view pad" data-view="live"></section>
    <section class="view canvas-host" data-view="tone" hidden></section>
    <section class="view pad" data-view="lab" hidden></section>
    <section class="view pad" data-view="info" hidden></section>
  </main>

  <nav id="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="live" aria-selected="true">
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 14h3l2.5-7 3 13 3-16 2.5 10H22"/>
      </svg>
      LIVE
    </button>
    <button class="tab" role="tab" data-tab="tone" aria-selected="false">
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"/><line x1="3.5" y1="12" x2="20.5" y2="12"/>
        <line x1="8" y1="12" x2="8" y2="17"/><line x1="16" y1="12" x2="16" y2="7"/>
      </svg>
      TONE
    </button>
    <button class="tab" role="tab" data-tab="lab" aria-selected="false">
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.5 3v6.2L4.6 18a2 2 0 0 0 1.7 3h11.4a2 2 0 0 0 1.7-3l-4.9-8.8V3"/>
        <line x1="8" y1="3" x2="16" y2="3"/>
      </svg>
      LAB
    </button>
    <button class="tab" role="tab" data-tab="info" aria-selected="false">
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/>
        <circle cx="12" cy="7.8" r=".6"/>
      </svg>
      INFO
    </button>
  </nav>

</div>
<script type="module" src="./main.js"></script>
</body>
</html>
